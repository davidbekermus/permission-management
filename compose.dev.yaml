services:
  mongo:
    extends:
      file: compose.yaml
      service: mongo

  server:
    extends:
      file: compose.yaml
      service: server
    build:
      target: development
    environment:
      NODE_ENV: development
      TSC_WATCHFILE: DynamicPriorityPolling
    healthcheck:
      # An unauthenticated request returns 401 once Nest is listening.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/users').then(r => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  client:
    build:
      context: ./client
      target: development
    environment:
      VITE_API_BASE_URL: /
      API_PROXY_TARGET: http://server:3000
      DOCKER_DEV: "true"
    ports:
      - "${CLIENT_PORT:-8080}:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo_data:
  server_node_modules:
  client_node_modules:
